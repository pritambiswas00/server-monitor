[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  /opt/fluent-bit/etc/parsers.conf

# ── App logs ─────────────────────────────────────────────────────────────────
[INPUT]
    Name              tail
    Path              /app/logs/app.log,/app/logs/error.log
    Tag               web.logs
    DB                /app/logs/.flb_pos.db
    Refresh_Interval  5
    Read_from_Head    True

# ── Host metrics ─────────────────────────────────────────────────────────────
[INPUT]
    Name             cpu
    Tag              web.metrics
    Interval_Sec     10

[INPUT]
    Name             mem
    Tag              web.metrics
    Interval_Sec     10

# ── Filters ──────────────────────────────────────────────────────────────────
# Only forward error-level app logs
[FILTER]
    Name   grep
    Match  web.logs
    Regex  log \"level\":\"error\"

# Enrich every log record with host metadata
[FILTER]
    Name              record_modifier
    Match             web.logs
    Record            hostname ${HOSTNAME}
    Record            source    web
    Record            env       production

# Enrich metrics with host metadata
[FILTER]
    Name              record_modifier
    Match             web.metrics
    Record            hostname ${HOSTNAME}
    Record            source    web

# ── Outputs ──────────────────────────────────────────────────────────────────
[OUTPUT]
    Name              http
    Match             web.logs
    Host              ${MONITOR_HOST}
    Port              ${MONITOR_PORT}
    URI               /log-analysis/ingest
    Format            json
    json_date_key     timestamp
    json_date_format  iso8601
    Header            Content-Type application/json

[OUTPUT]
    Name              http
    Match             web.metrics
    Host              ${MONITOR_HOST}
    Port              ${MONITOR_PORT}
    URI               /log-analysis/metrics
    Format            json
    json_date_key     timestamp
    json_date_format  iso8601
    Header            Content-Type application/json
