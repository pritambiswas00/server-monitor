[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info
    Parsers_File  /opt/fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Path              /app/logs/app.log,/app/logs/error.log
    Tag               web
    DB                /app/logs/.flb_pos.db
    Refresh_Interval  5
    Read_from_Head    True

[FILTER]
    Name   grep
    Match  *
    Regex  log \"level\":\"error\"

[OUTPUT]
    Name              http
    Match             *
    Host              ${MONITOR_HOST}
    Port              ${MONITOR_PORT}
    URI               /log-analysis/ingest
    Format            json
    json_date_key     timestamp
    json_date_format  iso8601
