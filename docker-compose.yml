services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3001:3001"
    environment:
      # Points Fluent Bit at the NestJS monitor running on the host machine.
      # On Linux the Docker bridge gateway is the host; on Mac/Windows use host.docker.internal.
      MONITOR_HOST: host.docker.internal
      MONITOR_PORT: "4000"
    volumes:
      - web-logs:/app/logs
    extra_hosts:
      # Ensures host.docker.internal resolves on Linux (no-op on Mac/Windows)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  web-logs:
